version: "3.9"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: homidirect-api-dev
    ports:
      - "5000:5000"
    env_file:
      - apps/api/.env
    depends_on:
      - db
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 5000 --reload

  db:
    image: postgres:16-alpine
    container_name: homidirect-db-dev
    environment:
      POSTGRES_DB: homidirect
      POSTGRES_USER: homidirect
      POSTGRES_PASSWORD: homidirect
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
