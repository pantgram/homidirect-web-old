services:
  app:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 5000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-ws://localhost:5000}
    ports:
      - "8080:8080"
    depends_on:
      - app
